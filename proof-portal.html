function cleanValue(value, fallback = "") {
  if (value === null || value === undefined) return fallback;
  const cleaned = String(value).trim();
  return cleaned || fallback;
}

function verifyEmailLight(email) {
  const cleanedEmail = cleanValue(email).toLowerCase();
  const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  if (!cleanedEmail) return { status: "MISSING", verified_at: "" };

  if (!emailPattern.test(cleanedEmail)) {
    return { status: "INVALID_FORMAT", verified_at: new Date().toISOString() };
  }

  return { status: "FORMAT_VERIFIED", verified_at: new Date().toISOString() };
}

function verifyPhoneLight(phone) {
  const cleanedPhone = cleanValue(phone);
  const digitsOnly = cleanedPhone.replace(/\D/g, "");

  if (!cleanedPhone) return { status: "MISSING", verified_at: "" };

  if (digitsOnly.length < 10) {
    return { status: "INVALID_FORMAT", verified_at: new Date().toISOString() };
  }

  return { status: "FORMAT_VERIFIED", verified_at: new Date().toISOString() };
}

}

  let issues = [];

    score -= 20;
    issues.push("email format is invalid");

  if (emailStatus === "MISSING") {
    score -= 25;
    issues.push("email is missing");

  if (phoneStatus === "INVALID_FORMAT") {
    score -= 20;
    issues.push("phone format is invalid");
  }

  if (phoneStatus === "MISSING") {
    score -= 25;
    issues.push("phone is missing");
  }

  if (!businessName || businessName === "Individual") {
    score -= 10;
    issues.push("business name was not fully supplied");

  if (!verificationIntent) {
    score -= 10;
    issues.push("verification intent is missing");

  if (source === "external_plugin") {
    score -= 5;
  }

  if (score < 0) score = 0;

  let riskLevel = "LOW";
  if (score < 75) riskLevel = "MEDIUM";
  if (score < 50) riskLevel = "HIGH";

// =====================================================
// VRI DOCUMENT FINGERPRINT / HASH LOGIC
// =====================================================

async function createSha256Hash(value) {
  if (!window.crypto || !window.crypto.subtle) {
    throw new Error("Secure browser crypto is not available. Document fingerprint could not be created.");
  }

  const encoder = new TextEncoder();
  const data = encoder.encode(value);
  const hashBuffer = await window.crypto.subtle.digest("SHA-256", data);

  return Array.from(new Uint8Array(hashBuffer))
    .map(byte => byte.toString(16).padStart(2, "0"))
    .join("");
}

async function createDocumentFingerprint(documentTitle, documentContent) {
  const normalizedDocument = JSON.stringify({
    document_title: cleanValue(documentTitle, "Untitled Document"),
    document_content: cleanValue(documentContent).replace(/\r\n/g, "\n").trim()
  });

  const hash = await createSha256Hash(normalizedDocument);

  return {
    document_hash: hash,
    original_hash: hash,
    current_hash: hash,
    hash_algorithm: "SHA-256",
    hash_status: "MATCH",
    document_changed: false,
    fingerprint_created_at: new Date().toISOString()
  };
}

function shortHash(hash) {
  if (!hash) return "N/A";
  return hash.substring(0, 16) + "...";
}

// =====================================================
// VRI AI CONTENT DISCLOSURE LOGIC
// =====================================================

function createAiDisclosure(aiUsedValue, aiToolNameValue, humanReviewedValue, aiDisclosureNoteValue) {
  const aiUsed = String(aiUsedValue) === "true";
  const humanReviewed = String(humanReviewedValue) !== "false";

  const aiToolName = cleanValue(
    aiToolNameValue,
    aiUsed ? "AI tool not specified" : "None"
  );

  const aiDisclosureNote = cleanValue(
    aiDisclosureNoteValue,
    aiUsed
      ? "AI assistance was disclosed, but no detailed note was provided."
      : "No AI assistance disclosed."
  );

  let aiContentStatus = "NOT_USED";

  if (aiUsed && humanReviewed) {
    aiContentStatus = "AI_ASSISTED_HUMAN_REVIEWED";
  }

  if (aiUsed && !humanReviewed) {
    aiContentStatus = "AI_ASSISTED_NOT_HUMAN_REVIEWED";
  }

  return {
    ai_used: aiUsed,
    ai_tool_name: aiToolName,
    ai_disclosure_note: aiDisclosureNote,
    human_reviewed: humanReviewed,
    ai_content_status: aiContentStatus,
    ai_disclosed_at: new Date().toISOString()
  };
}

function getAiBadge(aiDisclosure) {
  if (!aiDisclosure || !aiDisclosure.ai_used) {
    return "<span class='badge badge-green'>AI NOT USED</span>";
  }

  if (aiDisclosure.human_reviewed) {
    return "<span class='badge badge-yellow'>AI USED · HUMAN REVIEWED</span>";
  }

  return "<span class='badge badge-red'>AI USED · NOT HUMAN REVIEWED</span>";
}

function getOverallEmailStatus(senderEmailVerification, recipientEmailVerification) {
  if (
    senderEmailVerification.status === "FORMAT_VERIFIED" &&
    recipientEmailVerification.status === "FORMAT_VERIFIED"
  ) {
    return "FORMAT_VERIFIED";
  }

  if (
    senderEmailVerification.status === "MISSING" ||
    recipientEmailVerification.status === "MISSING"
  ) {
    return "MISSING";
  }

  return "INVALID_FORMAT";
}

    if (error) throw error;

    resultBox.innerHTML +=
      "<br><div style='margin-top:18px;padding:18px;border:2px solid " + (decision === "APPROVED" ? "#00ff99" : "#ff4d4d") + ";background:" + (decision === "APPROVED" ? "rgba(0,80,40,0.35)" : "rgba(120,0,0,0.35)") + ";border-radius:12px;text-align:center;font-weight:bold;font-size:20px;color:" + (decision === "APPROVED" ? "#00ff99" : "#ff8080") + ";'>" +
      decisionLabel + "<br>" +
      "Authority Code: " + authorityCode + "<br>" +
      "Supervisor: " + supervisorName + " (" + supervisorId + ")<br>" +
      "Department: " + department + "<br>" +
      "Witness: " + witness + "<br>" +
      "Timestamp: " + new Date(timestamp).toLocaleString() +
      "</div><br>";

  } catch (error) {
    resultBox.className = "result error";
    resultBox.innerHTML = "Supervisor authorization failed: " + error.message;
  }
}

function goToReceipt() {
  if (!lastProofId) {
    alert("No proof created yet.");
    return;
  }

  window.location.href = "/receipt.html?proof=" + encodeURIComponent(lastProofId);
}
</script>

</body>
</html>
